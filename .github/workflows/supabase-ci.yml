name: Supabase CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'scripts/check-migration-rls.mjs'
      - '.github/workflows/supabase-ci.yml'
  workflow_dispatch:

concurrency:
  group: supabase-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Offline checks only — no remote DB / no SUPABASE_DB_PASSWORD.
  # (supabase db lint --linked needs Postgres password; not available as a PR gate.)
  migration-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Lint migration files (static)
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(supabase/migrations/*.sql)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No migration files under supabase/migrations/"
            exit 1
          fi

          bad=0
          for f in "${files[@]}"; do
            base=$(basename "$f")
            # Supabase expects <timestamp>_<name>.sql (14-digit timestamp)
            if ! [[ "$base" =~ ^[0-9]{14}_.+\.sql$ ]]; then
              echo "::error::$f: invalid name (want YYYYMMDDHHMMSS_name.sql)"
              bad=1
            fi
            # empty *_placeholder.sql are historical no-ops; real migrations must be non-empty
            if [ ! -s "$f" ] && [[ "$base" != *_placeholder.sql ]]; then
              echo "::error::$f: empty file"
              bad=1
            fi
          done

          if [ "$bad" -ne 0 ]; then
            exit 1
          fi
          echo "✅ ${#files[@]} migration file(s) pass static lint"

  rls-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so origin/main...HEAD diff works for the GRANT check.
          fetch-depth: 0

      - name: Check table RLS declarations (static)
        run: node scripts/check-migration-rls.mjs

      # New migrations only (diff vs main) — existing files are never retroactively flagged.
      - name: Check for missing GRANTs
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          added=$(git diff --name-only --diff-filter=A origin/main...HEAD -- 'supabase/migrations/*.sql')
          if [ -z "$added" ]; then
            echo "✅ No new migration files — GRANT check skipped"
            exit 0
          fi

          missing=0
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            grep -qi 'create table' "$f" || continue
            if grep -q 'skip-grant-check' "$f"; then
              echo "$f: '-- skip-grant-check' present — skipped"
              continue
            fi
            if ! grep -qi 'grant' "$f" || ! grep -qi 'to authenticated' "$f"; then
              echo "::error::$f: CREATE TABLE without 'GRANT ... TO authenticated' — API calls will 403. Add 'GRANT SELECT, INSERT, UPDATE, DELETE ON <table> TO authenticated;' in the same file, or opt out with a '-- skip-grant-check: <reason>' comment (service_role-only tables)."
              missing=1
            fi
          done <<< "$added"

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "✅ All new CREATE TABLE migrations have GRANT coverage"
