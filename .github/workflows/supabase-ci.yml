name: Supabase CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch:

concurrency:
  group: supabase-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Offline checks only — no remote DB / no SUPABASE_DB_PASSWORD.
  # (supabase db lint --linked needs Postgres password; not available as a PR gate.)
  migration-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Lint migration files (static)
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(supabase/migrations/*.sql)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No migration files under supabase/migrations/"
            exit 1
          fi

          bad=0
          for f in "${files[@]}"; do
            base=$(basename "$f")
            # Supabase expects <timestamp>_<name>.sql (14-digit timestamp)
            if ! [[ "$base" =~ ^[0-9]{14}_.+\.sql$ ]]; then
              echo "::error::$f: invalid name (want YYYYMMDDHHMMSS_name.sql)"
              bad=1
            fi
            if [ ! -s "$f" ]; then
              echo "::error::$f: empty file"
              bad=1
            fi
          done

          if [ "$bad" -ne 0 ]; then
            exit 1
          fi
          echo "✅ ${#files[@]} migration file(s) pass static lint"

  rls-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check for missing RLS policies
        run: |
          missing=0
          for f in supabase/migrations/*.sql; do
            if grep -qi 'create table' "$f" && ! grep -qi 'alter table.*enable row level security' "$f" && ! grep -qi 'create policy' "$f"; then
              echo "::warning::$f: CREATE TABLE without ENABLE ROW LEVEL SECURITY or CREATE POLICY"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::One or more migrations create tables without RLS. Add 'ALTER TABLE ... ENABLE ROW LEVEL SECURITY' and policies."
            exit 1
          fi
          echo "✅ All migrations have RLS coverage"
