name: Deploy migrations

# dry-run (PR): offline preview of migration files in the branch — no DB password.
# deploy:
#   - release.yml workflow_call (v* tag / Release dispatch) — automatic
#   - workflow_dispatch confirm=deploy — hotfix without a desktop release

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm applying migrations to production'
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        description: 'Release version for Slack (empty if not a release)'
        required: false
        type: string
        default: ''
      called_from_release:
        description: 'Set by release.yml — skips the dispatch confirm gate'
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-migrations
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dry-run:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Preview migrations (offline)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          echo "=== All local migration files ==="
          find supabase/migrations -maxdepth 1 -name '*.sql' -print | sort

          echo ""
          echo "=== Changed vs base ($BASE_SHA) ==="
          if git rev-parse --verify "$BASE_SHA" >/dev/null 2>&1; then
            mapfile -t changed < <(git diff --name-only --diff-filter=ACMR "$BASE_SHA...$HEAD_SHA" -- 'supabase/migrations/*.sql' | sort || true)
          else
            changed=()
          fi

          if [ ${#changed[@]} -eq 0 ]; then
            echo "(no migration file changes detected vs base — paths filter still fired or rename-only)"
          else
            printf '%s\n' "${changed[@]}"
          fi

          echo ""
          echo "Note: remote db push --dry-run needs SUPABASE_DB_PASSWORD; PR gate stays offline."
          echo "Prod apply: next desktop release (automatic) or Actions → Deploy migrations → confirm=deploy"

  deploy:
    # Reusable workflows inherit the caller's event_name (tag Release = push),
    # not workflow_call. PR stays dry-run; dispatch and tag-push both deploy.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Safety check
        # Nested Release calls inherit the caller's event_name (push or
        # workflow_dispatch). confirm exists only on this workflow's own dispatch.
        # Keyed on an explicit input, not `github.workflow` — renaming the
        # workflow must not silently drop the gate (#335).
        if: ${{ !inputs.called_from_release }}
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -e
          if [ "$CONFIRM" != "deploy" ]; then
            echo "::error::confirm must be exactly 'deploy' (got '$CONFIRM')"
            exit 1
          fi
          echo "Confirmed — proceeding with migration deploy"

      - uses: actions/checkout@v7

      # pin: supabase/setup-cli@v1.7.1
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359
        with:
          version: 2.24.3

      - name: Deploy migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not set — cannot deploy migrations"
            exit 1
          fi
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::SUPABASE_DB_PASSWORD is not set — cannot deploy migrations"
            exit 1
          fi
          supabase link --project-ref vjdgdolfxvnxushxrmff
          echo "=== Migration list (before) ==="
          supabase migration list --linked
          # CLI 2.24.3 has no --yes. Non-TTY PromptYesNo defaults to true.
          supabase db push
          echo "=== Migration list (after) ==="
          supabase migration list --linked

      - name: Notify deploy success
        if: success()
        env:
          SLACK_WEBHOOK: ${{ secrets.VITE_SLACK_WEBHOOK_URL }}
          VERSION: ${{ inputs.version }}
        run: |
          if [ -z "$SLACK_WEBHOOK" ]; then
            echo "VITE_SLACK_WEBHOOK_URL not set — skipping notification"
            exit 0
          fi
          label="${VERSION:+v$VERSION}"
          label="${label:-manual}"
          curl -s -X POST -H 'Content-type: application/json' "$SLACK_WEBHOOK" \
            --data "{\"text\":\":white_check_mark: *Migration deploy succeeded* — \`${label}\` | <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>\"}"

      - name: Notify deploy failure
        if: failure()
        env:
          SLACK_WEBHOOK: ${{ secrets.VITE_SLACK_WEBHOOK_URL }}
        run: |
          if [ -n "$SLACK_WEBHOOK" ]; then
            curl -s -X POST -H 'Content-type: application/json' "$SLACK_WEBHOOK" \
              --data "{\"text\":\":x: *Migration deploy FAILED* — <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>\"}"
          else
            echo "VITE_SLACK_WEBHOOK_URL not set — skipping notification"
          fi
