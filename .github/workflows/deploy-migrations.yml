name: Deploy migrations

# dry-run: on PRs touching migrations, preview what `db push` would apply.
# deploy:  manual, gated by a typed confirm input, applies migrations to prod.

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm applying migrations to production'
        required: true
        type: string

concurrency:
  group: deploy-migrations
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dry-run:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # pin: supabase/setup-cli@v1.7.1
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
        with:
          version: 2.24.3

      - name: Dry-run migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -e
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not set — cannot dry-run migrations"
            exit 1
          fi
          supabase link --project-ref vjdgdolfxvnxushxrmff
          supabase db push --dry-run

  deploy:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Safety check
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -e
          if [ "$CONFIRM" != "deploy" ]; then
            echo "::error::confirm must be exactly 'deploy' (got '$CONFIRM')"
            exit 1
          fi
          echo "Confirmed — proceeding with migration deploy"

      - uses: actions/checkout@v4

      # pin: supabase/setup-cli@v1.7.1
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
        with:
          version: 2.24.3

      - name: Deploy migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -e
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not set — cannot deploy migrations"
            exit 1
          fi
          supabase link --project-ref vjdgdolfxvnxushxrmff
          supabase db push

      - name: Notify deploy failure
        if: failure()
        env:
          SLACK_WEBHOOK: ${{ secrets.VITE_SLACK_WEBHOOK_URL }}
        run: |
          if [ -n "$SLACK_WEBHOOK" ]; then
            curl -s -X POST -H 'Content-type: application/json' "$SLACK_WEBHOOK" \
              --data "{\"text\":\":x: *Migration deploy FAILED* — <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>\"}"
          else
            echo "VITE_SLACK_WEBHOOK_URL not set — skipping notification"
          fi
