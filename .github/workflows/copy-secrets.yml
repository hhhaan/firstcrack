# One-shot: copy this repo's Actions secrets to firstcrackproj/fc-desktop.
# Run once via workflow_dispatch, then delete this file and the COPY_PAT secret.
name: copy-secrets
on:
  workflow_dispatch:
permissions: {}
jobs:
  copy:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.COPY_PAT }}
      TARGET: firstcrackproj/fc-desktop
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      R2_PUBLISH_ACCESS_KEY_ID: ${{ secrets.R2_PUBLISH_ACCESS_KEY_ID }}
      R2_PUBLISH_ACCOUNT_ID: ${{ secrets.R2_PUBLISH_ACCOUNT_ID }}
      R2_PUBLISH_BUCKET_NAME: ${{ secrets.R2_PUBLISH_BUCKET_NAME }}
      R2_PUBLISH_SECRET_ACCESS_KEY: ${{ secrets.R2_PUBLISH_SECRET_ACCESS_KEY }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      VITE_SLACK_WEBHOOK_URL: ${{ secrets.VITE_SLACK_WEBHOOK_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
    steps:
      - name: Copy
        run: |
          set -eu
          for n in \
            APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD \
            APPLE_SIGNING_IDENTITY APPLE_TEAM_ID \
            R2_PUBLISH_ACCESS_KEY_ID R2_PUBLISH_ACCOUNT_ID R2_PUBLISH_BUCKET_NAME R2_PUBLISH_SECRET_ACCESS_KEY \
            SENTRY_AUTH_TOKEN SENTRY_ORG SENTRY_PROJECT \
            SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD \
            TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD \
            VITE_SLACK_WEBHOOK_URL VITE_SUPABASE_ANON_KEY VITE_SUPABASE_URL \
          ; do
            if [ -z "${!n:-}" ]; then echo "::warning::$n empty on source, skipped"; continue; fi
            gh secret set "$n" --repo "$TARGET" --body "${!n}"
            echo "copied $n"
          done
