name: Publish to R2

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Build run ID to download artifacts from'
        required: true
      version:
        description: 'Version string (e.g. 1.0.2)'
        required: true
      allow_republish:
        description: 'Overwrite releases/<version>/ if it already exists'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  publish-r2:
    uses: ./.github/workflows/_publish-r2-reusable.yml
    with:
      version: ${{ inputs.version }}
      run_id: ${{ inputs.run_id }}
      allow_republish: ${{ inputs.allow_republish }}
    secrets: inherit
