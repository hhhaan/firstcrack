name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.0.2). Required when not triggered by a tag.'
        required: false

permissions:
  contents: read
  actions: write
  checks: read

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          elif [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            echo "::error::Cannot determine version. Push a semver tag (v*) or supply the 'version' input."
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Resolved version: $VERSION"

  build:
    needs: setup
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: windows-latest
            target: x86_64-pc-windows-msvc

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Check CI status before building
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Checking CI status for commit ${GITHUB_SHA}..."

          # Retry up to 3 minutes (6×30s) to wait for CI to start
          for i in 1 2 3 4 5 6; do
            RESPONSE=$(gh api "repos/${{ github.repository }}/commits/${GITHUB_SHA}/check-runs" \
              --jq '[.check_runs[] | select(.name == "typecheck" or .name == "lint" or .name == "eslint" or .name == "test" or .name == "sidecar")]')
            TOTAL=$(echo "$RESPONSE" | jq 'length')

            if [ "$TOTAL" -eq 0 ]; then
              echo "::warning::No CI checks found yet (attempt $i/6). Waiting 30s..."
              sleep 30
              continue
            fi

            # Count failures only — null/pending/in_progress are fine
            FAILED=$(echo "$RESPONSE" | jq '[.[] | select(.conclusion == "failure" or .conclusion == "timed_out" or .conclusion == "cancelled")] | length')
            PENDING=$(echo "$RESPONSE" | jq '[.[] | select(.conclusion == null or .conclusion == "neutral" or .conclusion == "skipped")] | length')

            echo "CI checks found: $TOTAL (pending: $PENDING, failed: $FAILED)"
            echo "$RESPONSE" | jq -r '.[] | "  \(.name): \(.conclusion)"'

            if [ "$FAILED" -gt 0 ]; then
              echo "::error::$FAILED CI check(s) failed. Release aborted."
              exit 1
            fi

            if [ "$PENDING" -eq 0 ]; then
              echo "✅ All CI checks passed."
              exit 0
            fi

            if [ "$i" -lt 6 ]; then
              echo "⏳ $PENDING check(s) still running — waiting 30s (attempt $i/6)..."
              sleep 30
            fi
          done

          # After all retries — if only pending/skipped/neutral remain, proceed
          echo "::warning::CI checks still pending after 3 min — proceeding anyway."
          exit 0

      - name: Validate required secrets
        env:
          TAURI_KEY:     ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_KEY_PW:  ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          SUPABASE_URL:  ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          APPLE_CERT:    ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERT_PW: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID:      ${{ secrets.APPLE_ID }}
          APPLE_PW:      ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM:    ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=false
          check() {
            if [ -z "${!1}" ]; then
              echo "  MISSING: $2"
              missing=true
            fi
          }

          echo "Checking shared secrets..."
          check TAURI_KEY        "TAURI_SIGNING_PRIVATE_KEY"
          check TAURI_KEY_PW     "TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
          check SUPABASE_URL     "VITE_SUPABASE_URL"
          check SUPABASE_ANON    "VITE_SUPABASE_ANON_KEY"

          if [ "$RUNNER_OS" = "macOS" ]; then
            echo "Checking macOS signing secrets..."
            check APPLE_CERT      "APPLE_CERTIFICATE"
            check APPLE_CERT_PW   "APPLE_CERTIFICATE_PASSWORD"
            check APPLE_IDENTITY  "APPLE_SIGNING_IDENTITY"
            check APPLE_ID        "APPLE_ID"
            check APPLE_PW        "APPLE_PASSWORD"
            check APPLE_TEAM      "APPLE_TEAM_ID"
          fi

          if [ "$missing" = "true" ]; then
            echo "::error::One or more required secrets are missing – aborting before build."
            exit 1
          fi
          echo "All required secrets present."

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: rust-${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install frontend deps
        run: pnpm install

      - name: Sync version across manifests
        run: |
          VERSION="${{ needs.setup.outputs.version }}"
          echo "Syncing version to $VERSION"
          node <<'NODE'
          const fs = require('fs');
          const version = process.env.VERSION;
          const tauriConfPath = 'src-tauri/tauri.conf.json';
          const tauriConf = JSON.parse(fs.readFileSync(tauriConfPath, 'utf8'));
          tauriConf.version = version;
          fs.writeFileSync(tauriConfPath, `${JSON.stringify(tauriConf, null, 4)}\n`);
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.version = version;
          fs.writeFileSync('package.json', `${JSON.stringify(pkg, null, 4)}\n`);
          NODE
          sed -i.bak "s/^version = \".*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml
          rm -f src-tauri/Cargo.toml.bak
        env:
          VERSION: ${{ needs.setup.outputs.version }}

      - name: Cache sidecar binary
        id: sidecar-cache
        uses: actions/cache@v4
        with:
          path: src-tauri/binaries
          key: sidecar-${{ matrix.target }}-${{ hashFiles('src-tauri/sidecar/requirements.txt', 'src-tauri/sidecar/**/*.py', 'src-tauri/sidecar/sidecar.spec') }}

      - name: Set up Python
        if: steps.sidecar-cache.outputs.cache-hit != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: src-tauri/sidecar/requirements.txt

      - name: Install sidecar dependencies
        if: steps.sidecar-cache.outputs.cache-hit != 'true'
        run: pip install pyinstaller -r src-tauri/sidecar/requirements.txt

      - name: Build sidecar binary
        if: steps.sidecar-cache.outputs.cache-hit != 'true'
        run: pnpm run build:sidecar

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          PUBLIC_SITE_URL: https://your-domain.com
          PUBLIC_TAURI_REDIRECT: firstcrack://auth/callback
          CARGO_INCREMENTAL: "0"
          RUSTFLAGS: "-C debuginfo=0"
          CARGO_NET_RETRY: "3"
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          args: --target ${{ matrix.target }}

      - name: Upload macOS artifacts
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz.sig
          retention-days: 1

      - name: Upload Windows artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi.sig
          retention-days: 1

      - name: Notify build failure
        if: failure()
        env:
          SLACK_WEBHOOK: ${{ secrets.VITE_SLACK_WEBHOOK_URL }}
        run: |
          if [ -n "$SLACK_WEBHOOK" ]; then
            curl -s -X POST -H 'Content-type: application/json' "$SLACK_WEBHOOK" \
              --data "{\"text\":\":x: *Release build FAILED* — \`${GITHUB_REF_NAME}\` | \`${{ matrix.target }}\` | <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>\"}"
          else
            echo "VITE_SLACK_WEBHOOK_URL not set — skipping notification"
          fi

  notify-build:
    needs: [setup, build]
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Notify build success
        env:
          SLACK_WEBHOOK: ${{ secrets.VITE_SLACK_WEBHOOK_URL }}
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          if [ -n "$SLACK_WEBHOOK" ]; then
            curl -s -X POST -H 'Content-type: application/json' "$SLACK_WEBHOOK" \
              --data "{\"text\":\":white_check_mark: *Release build succeeded* — v${VERSION} (macOS arm64/x64 + Windows) | <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>\"}"
          else
            echo "VITE_SLACK_WEBHOOK_URL not set — skipping notification"
          fi

  publish-r2:
    needs: [setup, build]
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/_publish-r2-reusable.yml
    with:
      version: ${{ needs.setup.outputs.version }}
    secrets: inherit

  cleanup-artifacts:
    needs: [publish-r2]
    if: success()
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete release build artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for name in \
            "macos-aarch64-apple-darwin" \
            "macos-x86_64-apple-darwin" \
            "windows-x86_64-pc-windows-msvc"
          do
            id=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
              --jq ".artifacts[] | select(.name == \"$name\") | .id")
            if [ -n "$id" ]; then
              gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id"
              echo "Deleted artifact: $name (id: $id)"
            else
              echo "Artifact not found (already expired?): $name"
            fi
          done
