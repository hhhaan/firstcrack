name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: rust-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}

      - name: Install frontend deps
        run: pnpm install

      - name: Cache sidecar binary
        id: sidecar-cache
        uses: actions/cache@v4
        with:
          path: src-tauri/binaries
          key: sidecar-${{ matrix.target }}-${{ hashFiles('src-tauri/sidecar/requirements.txt', 'src-tauri/sidecar/**/*.py', 'src-tauri/sidecar/sidecar.spec') }}

      - name: Set up Python
        if: steps.sidecar-cache.outputs.cache-hit != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: src-tauri/sidecar/requirements.txt

      - name: Install sidecar dependencies
        if: steps.sidecar-cache.outputs.cache-hit != 'true'
        run: pip install pyinstaller -r src-tauri/sidecar/requirements.txt

      - name: Build sidecar binary
        if: steps.sidecar-cache.outputs.cache-hit != 'true'
        run: npm run build:sidecar

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_R2_ACCOUNT_ID: ${{ secrets.VITE_R2_ACCOUNT_ID }}
          VITE_R2_ACCESS_KEY_ID: ${{ secrets.VITE_R2_ACCESS_KEY_ID }}
          VITE_R2_SECRET_ACCESS_KEY: ${{ secrets.VITE_R2_SECRET_ACCESS_KEY }}
          VITE_R2_BUCKET_NAME: ${{ secrets.VITE_R2_BUCKET_NAME }}
          CARGO_INCREMENTAL: "0"
          # macOS 코드 사이닝 & 노타리제이션 (Apple Developer Program)
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          args: --target ${{ matrix.target }}

      - name: Upload macOS artifacts
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz.sig

      - name: Upload Windows artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi.sig

  publish-r2:
    needs: [build]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Upload binaries & latest.json to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.VITE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.VITE_R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: https://da47c859f47b9284b03ecca3c349ab87.r2.cloudflarestorage.com
          VERSION: ${{ steps.version.outputs.VERSION }}
          R2_BUCKET: first-crack
          R2_PUBLIC_URL: https://pub-32f64eaa15504eeba9203bcbbced439d.r2.dev
        run: |
          set -e

          # Upload all binaries under releases/{version}/ (parallel)
          find artifacts -type f \( -name "*.dmg" -o -name "*.tar.gz" -o -name "*.sig" -o -name "*.msi" \) | \
            xargs -I {} -P 4 bash -c 'aws s3 cp "$1" "s3://$R2_BUCKET/releases/$VERSION/$(basename "$1")" --endpoint-url "$R2_ENDPOINT" --region auto' _ {}

          # Build latest.json
          AARCH64_SIG=$(find artifacts -name "*aarch64.app.tar.gz.sig" | head -1)
          X64_SIG=$(find artifacts -name "*x64.app.tar.gz.sig" | head -1)
          WIN_MSI_SIG=$(find artifacts -name "*.msi.sig" | head -1)
          AARCH64_TAR_NAME=$(find artifacts -name "*aarch64.app.tar.gz" -exec basename {} \; | head -1)
          X64_TAR_NAME=$(find artifacts -name "*x64.app.tar.gz" -exec basename {} \; | head -1)
          WIN_MSI_NAME=$(find artifacts -name "*.msi" -not -name "*.sig" -exec basename {} \; | head -1)

          # Validate critical artifacts exist
          [ -z "$AARCH64_TAR_NAME" ] && echo "ERROR: macOS arm64 artifact not found" && exit 1
          [ -z "$X64_TAR_NAME" ] && echo "ERROR: macOS x64 artifact not found" && exit 1
          [ -z "$WIN_MSI_NAME" ] && echo "ERROR: Windows MSI artifact not found" && exit 1

          jq --null-input \
            --arg version "$VERSION" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg aarch64_sig "$([ -n "$AARCH64_SIG" ] && cat "$AARCH64_SIG" || echo "")" \
            --arg aarch64_url "$R2_PUBLIC_URL/releases/$VERSION/$AARCH64_TAR_NAME" \
            --arg x64_sig "$([ -n "$X64_SIG" ] && cat "$X64_SIG" || echo "")" \
            --arg x64_url "$R2_PUBLIC_URL/releases/$VERSION/$X64_TAR_NAME" \
            --arg win_sig "$([ -n "$WIN_MSI_SIG" ] && cat "$WIN_MSI_SIG" || echo "")" \
            --arg win_url "$R2_PUBLIC_URL/releases/$VERSION/$WIN_MSI_NAME" \
            '{version:$version,notes:"",pub_date:$pub_date,platforms:{"darwin-aarch64":{signature:$aarch64_sig,url:$aarch64_url},"darwin-x86_64":{signature:$x64_sig,url:$x64_url},"windows-x86_64":{signature:$win_sig,url:$win_url}}}' \
            > latest.json

          aws s3 cp latest.json "s3://$R2_BUCKET/releases/latest.json" \
            --endpoint-url "$R2_ENDPOINT" --region auto

          # Upload fixed-name aliases to releases/latest/ for landing page links
          AARCH64_DMG=$(find artifacts -name "*aarch64.dmg" | head -1)
          X64_DMG=$(find artifacts -name "*x64.dmg" | head -1)
          WIN_MSI=$(find artifacts -name "*.msi" -not -name "*.sig" | head -1)

          [ -n "$AARCH64_DMG" ] && aws s3 cp "$AARCH64_DMG" "s3://$R2_BUCKET/releases/latest/First-Crack-arm64.dmg" \
            --endpoint-url "$R2_ENDPOINT" --region auto
          [ -n "$X64_DMG" ] && aws s3 cp "$X64_DMG" "s3://$R2_BUCKET/releases/latest/First-Crack-x64.dmg" \
            --endpoint-url "$R2_ENDPOINT" --region auto
          [ -n "$WIN_MSI" ] && aws s3 cp "$WIN_MSI" "s3://$R2_BUCKET/releases/latest/First-Crack-Windows.msi" \
            --endpoint-url "$R2_ENDPOINT" --region auto
