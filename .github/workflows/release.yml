name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.0.2). Required when not triggered by a tag. Must equal tauri.conf.json version.'
        required: false
      allow_republish:
        description: 'Overwrite releases/<version>/ on R2 if it already exists'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            # A dispatched version that differs from the manifest builds HEAD but
            # publishes under another number (#335). Tag pushes are already synced.
            MANIFEST=$(jq -r .version src-tauri/tauri.conf.json)
            if [ "$INPUT_VERSION" != "$MANIFEST" ]; then
              echo "::error::version input '$INPUT_VERSION' != tauri.conf.json version '$MANIFEST' on this ref"
              exit 1
            fi
            VERSION="$INPUT_VERSION"
          elif [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            echo "::error::Cannot determine version. Push a semver tag (v*) or supply the 'version' input."
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Resolved version: $VERSION"

  ci-gate:
    needs: setup
    runs-on: ubuntu-latest
    permissions:
      checks: read
    timeout-minutes: 15
    steps:
      - name: Wait for CI checks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Checking CI status for commit ${GITHUB_SHA}..."

          # Retry up to 10 minutes (20×30s). Names = ci.yml job ids.
          # skipped (ios-check path filter) is success, not pending.
          for i in $(seq 1 20); do
            RESPONSE=$(gh api "repos/${{ github.repository }}/commits/${GITHUB_SHA}/check-runs" \
              --jq '[.check_runs[] | select(.name == "paths" or .name == "check" or .name == "test" or .name == "sidecar" or .name == "ios-check" or .name == "semgrep" or .name == "gitleaks" or .name == "edge-check")]')
            TOTAL=$(echo "$RESPONSE" | jq 'length')

            if [ "$TOTAL" -eq 0 ]; then
              # CI check-runs appear within seconds of a push. If none exist after
              # ~2 min, this SHA was never a push head (e.g. tag on a stacked commit
              # pushed in a batch — v1.1.18) and checks will NEVER appear. Fail fast.
              if [ "$i" -ge 4 ]; then
                echo "::error::No CI check-runs on ${GITHUB_SHA} after $i attempts — this commit was likely never a push head (tag points at a stacked commit). Tag the pushed main HEAD via 'pnpm release' instead."
                exit 1
              fi
              echo "::warning::No CI checks found yet (attempt $i/20). Waiting 30s..."
              sleep 30
              continue
            fi

            FAILED=$(echo "$RESPONSE" | jq '[.[] | select(.conclusion == "failure" or .conclusion == "timed_out" or .conclusion == "cancelled")] | length')
            PENDING=$(echo "$RESPONSE" | jq '[.[] | select(.conclusion == null or .conclusion == "neutral")] | length')

            echo "CI checks found: $TOTAL (pending: $PENDING, failed: $FAILED)"
            echo "$RESPONSE" | jq -r '.[] | "  \(.name): \(.conclusion)"'

            if [ "$FAILED" -gt 0 ]; then
              echo "::error::$FAILED CI check(s) failed. Release aborted."
              exit 1
            fi

            if [ "$PENDING" -eq 0 ]; then
              echo "✅ All CI checks passed."
              exit 0
            fi

            if [ "$i" -lt 20 ]; then
              echo "⏳ $PENDING check(s) still running — waiting 30s (attempt $i/20)..."
              sleep 30
            fi
          done

          echo "::error::CI checks still pending after 10 min — aborting release. Re-run once CI completes."
          exit 1

  # Order: build → migrate → publish. Migrating first left prod schema ahead of
  # an app that never shipped whenever a 3-runner build failed (#342).
  build:
    needs: [setup, ci-gate]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: windows-latest
            target: x86_64-pc-windows-msvc

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - name: Validate required secrets
        env:
          TAURI_KEY:     ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_KEY_PW:  ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          SUPABASE_URL:  ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          APPLE_CERT:    ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERT_PW: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID:      ${{ secrets.APPLE_ID }}
          APPLE_PW:      ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM:    ${{ secrets.APPLE_TEAM_ID }}
          SENTRY_TOKEN:  ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG:    ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJ:   ${{ secrets.SENTRY_PROJECT }}
        run: |
          missing=false
          check() {
            if [ -z "${!1}" ]; then
              echo "  MISSING: $2"
              missing=true
            fi
          }

          echo "Checking shared secrets..."
          check TAURI_KEY        "TAURI_SIGNING_PRIVATE_KEY"
          check TAURI_KEY_PW     "TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
          check SUPABASE_URL     "VITE_SUPABASE_URL"
          check SUPABASE_ANON    "VITE_SUPABASE_ANON_KEY"
          check SENTRY_TOKEN     "SENTRY_AUTH_TOKEN"
          check SENTRY_ORG       "SENTRY_ORG"
          check SENTRY_PROJ      "SENTRY_PROJECT"

          if [ "$RUNNER_OS" = "macOS" ]; then
            echo "Checking macOS signing secrets..."
            check APPLE_CERT      "APPLE_CERTIFICATE"
            check APPLE_CERT_PW   "APPLE_CERTIFICATE_PASSWORD"
            check APPLE_IDENTITY  "APPLE_SIGNING_IDENTITY"
            check APPLE_ID        "APPLE_ID"
            check APPLE_PW        "APPLE_PASSWORD"
            check APPLE_TEAM      "APPLE_TEAM_ID"
          fi

          if [ "$missing" = "true" ]; then
            echo "::error::One or more required secrets are missing – aborting before build."
            exit 1
          fi
          echo "All required secrets present."

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      # Restore-only: tag refs can only restore caches saved on main, and caches
      # saved on a tag ref are never reusable. Warming happens in
      # warm-release-cache.yml (main) with the same shared-key.
      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          shared-key: rust-${{ matrix.target }}
          save-if: false

      - name: Install frontend deps
        run: pnpm install

      - name: Sync version across manifests
        run: |
          VERSION="${{ needs.setup.outputs.version }}"
          echo "Syncing version to $VERSION"
          node <<'NODE'
          const fs = require('fs');
          const version = process.env.VERSION;
          const tauriConfPath = 'src-tauri/tauri.conf.json';
          const tauriConf = JSON.parse(fs.readFileSync(tauriConfPath, 'utf8'));
          tauriConf.version = version;
          fs.writeFileSync(tauriConfPath, `${JSON.stringify(tauriConf, null, 4)}\n`);
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.version = version;
          fs.writeFileSync('package.json', `${JSON.stringify(pkg, null, 4)}\n`);
          NODE
          sed -i.bak "s/^version = \".*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml
          rm -f src-tauri/Cargo.toml.bak
        env:
          VERSION: ${{ needs.setup.outputs.version }}

      - name: Cache sidecar binary
        id: sidecar-cache
        uses: actions/cache@v6
        with:
          path: src-tauri/binaries
          key: sidecar-${{ matrix.target }}-${{ hashFiles('src-tauri/sidecar/requirements.txt', 'src-tauri/sidecar/**/*.py', 'src-tauri/sidecar/sidecar.spec') }}

      - name: Set up Python
        if: steps.sidecar-cache.outputs.cache-hit != 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: src-tauri/sidecar/requirements.txt

      - name: Install sidecar dependencies
        if: steps.sidecar-cache.outputs.cache-hit != 'true'
        run: pip install pyinstaller -r src-tauri/sidecar/requirements.txt

      - name: Build sidecar binary
        if: steps.sidecar-cache.outputs.cache-hit != 'true'
        run: pnpm run build:sidecar

      # Runs on cache hit too: a cached binary that no longer boots is exactly the bug (#342).
      - name: Smoke-test sidecar binary
        run: bash scripts/smoke-sidecar.sh ${{ matrix.target }}

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          PUBLIC_TAURI_REDIRECT: firstcrack://auth/callback
          CARGO_INCREMENTAL: "0"
          CARGO_NET_RETRY: "3"
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
          # Vite 플러그인이 pnpm build(beforeBuildCommand) 중 JS 소스맵을 업로드+삭제한다.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          args: --target ${{ matrix.target }}

      # JS 소스맵은 Vite 플러그인이 이미 업로드+삭제했다 — 여기는 Rust 네이티브 심볼만.
      # (macOS .dSYM / Windows .pdb). @sentry/cli는 devDependency — lockfile 핀 + integrity 검증,
      # curl|sh / npm -g 설치 없음.
      - name: Upload native debug symbols to Sentry
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          pnpm exec sentry-cli debug-files upload "src-tauri/target/${{ matrix.target }}/release/"
          pnpm exec sentry-cli releases finalize "first-crack@$VERSION"

      - name: Upload macOS artifacts
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz.sig
          retention-days: 1

      - name: Upload Windows artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi.sig
          retention-days: 1

      - name: Notify build failure
        if: failure()
        env:
          SLACK_WEBHOOK: ${{ secrets.VITE_SLACK_WEBHOOK_URL }}
        run: |
          if [ -n "$SLACK_WEBHOOK" ]; then
            curl -s -X POST -H 'Content-type: application/json' "$SLACK_WEBHOOK" \
              --data "{\"text\":\":x: *Release build FAILED* — \`${GITHUB_REF_NAME}\` | \`${{ matrix.target }}\` | <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>\"}"
          else
            echo "VITE_SLACK_WEBHOOK_URL not set — skipping notification"
          fi

  notify-build:
    needs: [setup, build]
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Notify build success
        env:
          SLACK_WEBHOOK: ${{ secrets.VITE_SLACK_WEBHOOK_URL }}
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          if [ -n "$SLACK_WEBHOOK" ]; then
            curl -s -X POST -H 'Content-type: application/json' "$SLACK_WEBHOOK" \
              --data "{\"text\":\":white_check_mark: *Release build succeeded* — v${VERSION} (macOS arm64/x64 + Windows) | <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>\"}"
          else
            echo "VITE_SLACK_WEBHOOK_URL not set — skipping notification"
          fi

  migrate:
    needs: [setup, build]
    uses: ./.github/workflows/deploy-migrations.yml
    with:
      version: ${{ needs.setup.outputs.version }}
      called_from_release: true
    secrets: inherit

  # Inner jobs all skipped → reusable result is skipped, run stays green.
  # Fail here so a bad migrate `if:` cannot ship a no-op release.
  migrate-ok:
    needs: [setup, migrate]
    if: always() && needs.setup.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require migrate success
        run: |
          result="${{ needs.migrate.result }}"
          echo "migrate result=$result"
          if [ "$result" != "success" ]; then
            echo "::error::migrate did not succeed (got $result). Reusable workflows inherit the caller event_name (tag push ≠ workflow_call)."
            exit 1
          fi

  # Build artifacts expire via retention-days: 1 — no cleanup job needed.
  publish-r2:
    needs: [setup, build, migrate-ok]
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/_publish-r2-reusable.yml
    with:
      version: ${{ needs.setup.outputs.version }}
      allow_republish: ${{ inputs.allow_republish || false }}
    secrets: inherit
