name: Hotfix Windows updater URL

# Patch latest.json so the Windows MSI URL is percent-encoded (spaces → %20).
# No MSI re-upload needed — the file on R2 is fine, only the URL in JSON was invalid.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - name: Fix Windows URL in latest.json
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_PUBLISH_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_PUBLISH_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: https://${{ secrets.R2_PUBLISH_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_BUCKET: ${{ secrets.R2_PUBLISH_BUCKET_NAME }}
        run: |
          set -e

          aws s3 cp "s3://$R2_BUCKET/releases/latest.json" latest.json \
            --endpoint-url "$R2_ENDPOINT" --region auto

          python3 <<'PY'
          import json
          import urllib.parse

          with open("latest.json", encoding="utf-8") as f:
              data = json.load(f)

          win = data["platforms"]["windows-x86_64"]
          old_url = win["url"]
          parts = urllib.parse.urlsplit(old_url)
          fixed_url = urllib.parse.urlunsplit(
              parts._replace(path=urllib.parse.quote(parts.path, safe="/"))
          )

          if old_url == fixed_url:
              print(f"URL already encoded: {old_url}")
          else:
              print(f"Before: {old_url}")
              print(f"After:  {fixed_url}")
              win["url"] = fixed_url

          with open("latest.fixed.json", "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2)
              f.write("\n")
          PY

          aws s3 cp latest.fixed.json "s3://$R2_BUCKET/releases/latest.json" \
            --endpoint-url "$R2_ENDPOINT" --region auto \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "application/json"

          echo "✅ latest.json updated"
