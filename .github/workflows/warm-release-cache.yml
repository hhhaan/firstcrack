name: Warm release cache

# Release builds run on tag refs, which can only RESTORE caches saved on main —
# caches saved on a tag ref are dead on arrival (proven: identical sidecar keys
# stored separately on v1.1.17 and v1.1.19, zero cross-tag hits ever).
# This workflow builds on main so release.yml gets warm rust/sidecar/pnpm/pip
# caches. No signing, no bundling, no uploads.

on:
  push:
    branches: [main]
    paths:
      - 'src-tauri/Cargo.lock'
      - 'src-tauri/Cargo.toml'
      - 'src-tauri/tauri.conf.json'
      - 'src-tauri/sidecar/**'
  schedule:
    - cron: '0 18 * * 0' # Sunday 18:00 UTC = Monday 03:00 KST, before Dependabot Mondays
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: warm-release-cache
  cancel-in-progress: true

jobs:
  warm:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: windows-latest
            target: x86_64-pc-windows-msvc

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Same shared-key as release.yml; saved here on main, restored there on tags.
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: rust-${{ matrix.target }}

      - name: Install frontend deps
        run: pnpm install

      # Same key expression as release.yml Cache sidecar binary
      - name: Cache sidecar binary
        id: sidecar-cache
        uses: actions/cache@v4
        with:
          path: src-tauri/binaries
          key: sidecar-${{ matrix.target }}-${{ hashFiles('src-tauri/sidecar/requirements.txt', 'src-tauri/sidecar/**/*.py', 'src-tauri/sidecar/sidecar.spec') }}

      - name: Set up Python
        if: steps.sidecar-cache.outputs.cache-hit != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: src-tauri/sidecar/requirements.txt

      - name: Install sidecar dependencies
        if: steps.sidecar-cache.outputs.cache-hit != 'true'
        run: pip install pyinstaller -r src-tauri/sidecar/requirements.txt

      - name: Build sidecar binary
        if: steps.sidecar-cache.outputs.cache-hit != 'true'
        run: pnpm run build:sidecar

      # --no-bundle: full release-profile cargo compile (what the cache is for),
      # skips bundling/signing/updater artifacts so no signing secrets needed.
      # CARGO_INCREMENTAL/RUSTFLAGS must match release.yml or dep fingerprints
      # differ and the cache is useless.
      - name: Compile (warm rust cache)
        run: pnpm tauri build --no-bundle --target ${{ matrix.target }}
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          PUBLIC_TAURI_REDIRECT: firstcrack://auth/callback
          CARGO_INCREMENTAL: "0"
          RUSTFLAGS: "-C debuginfo=0"
          CARGO_NET_RETRY: "3"
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
