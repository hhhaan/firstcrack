name: Warm release cache

# Release builds run on tag refs, which can only RESTORE caches saved on main —
# caches saved on a tag ref are dead on arrival (proven: identical sidecar keys
# stored separately on v1.1.17 and v1.1.19, zero cross-tag hits ever).
# This workflow builds on main so release.yml gets warm rust/sidecar/pnpm/pip
# caches. No signing, no bundling, no uploads.

on:
  push:
    branches: [main]
    paths:
      - 'src-tauri/Cargo.lock'
      - 'src-tauri/Cargo.toml'
      - 'src-tauri/tauri.conf.json'
      - 'src-tauri/sidecar/**'
  schedule:
    - cron: '0 18 * * 0' # Sunday 18:00 UTC = Monday 03:00 KST, before Dependabot Mondays
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: warm-release-cache
  cancel-in-progress: true

jobs:
  warm:
    # Skip the version-bump commit: it touches Cargo.toml/Cargo.lock/tauri.conf.json,
    # so it would start a 3-runner compile alongside the release build it precedes
    # (double macOS minutes, and the release queues behind it for runners).
    if: >-
      github.event_name != 'push' ||
      !startsWith(github.event.head_commit.message, 'chore(release): bump version')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: windows-latest
            target: x86_64-pc-windows-msvc

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      # Not pnpm/action-setup: with a packageManager field it ignores `version`,
      # installs latest pnpm (11.20+) and lets pnpm switch down to 11.3.0 — that
      # switch fails the @pnpm/exe engine-identity check on darwin-x64
      # (pnpm/pnpm#13622) and killed v1.2.1. Installing the exact packageManager
      # version via npm means no switch ever happens.
      - name: Install pnpm (exact packageManager version)
        run: |
          PNPM_VERSION=$(node -p "require('./package.json').packageManager.split('@')[1].split('+')[0]")
          npm install -g "pnpm@${PNPM_VERSION}"
          pnpm --version
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      # Same shared-key as release.yml; saved here on main, restored there on tags.
      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          shared-key: rust-${{ matrix.target }}

      - name: Install frontend deps
        run: pnpm install

      # Same key expression as release.yml Cache sidecar binary
      - name: Cache sidecar binary
        id: sidecar-cache
        uses: actions/cache@v6
        with:
          path: src-tauri/binaries
          key: sidecar-${{ matrix.target }}-${{ hashFiles('src-tauri/sidecar/requirements.txt', 'src-tauri/sidecar/**/*.py', 'src-tauri/sidecar/sidecar.spec') }}

      - name: Set up Python
        if: steps.sidecar-cache.outputs.cache-hit != 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: src-tauri/sidecar/requirements.txt

      - name: Install sidecar dependencies
        if: steps.sidecar-cache.outputs.cache-hit != 'true'
        run: pip install pyinstaller -r src-tauri/sidecar/requirements.txt

      - name: Build sidecar binary
        if: steps.sidecar-cache.outputs.cache-hit != 'true'
        run: pnpm run build:sidecar

      # Runs on cache hit too: a cached binary that no longer boots is exactly the bug (#342).
      - name: Smoke-test sidecar binary
        run: bash scripts/smoke-sidecar.sh ${{ matrix.target }}

      # --no-bundle: full release-profile cargo compile (what the cache is for),
      # skips bundling/signing/updater artifacts so no signing secrets needed.
      # CARGO_INCREMENTAL/RUSTFLAGS must match release.yml or dep fingerprints
      # differ and the cache is useless.
      - name: Compile (warm rust cache)
        run: pnpm tauri build --no-bundle --target ${{ matrix.target }}
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          PUBLIC_TAURI_REDIRECT: firstcrack://auth/callback
          CARGO_INCREMENTAL: "0"
          RUSTFLAGS: "-C debuginfo=0"
          CARGO_NET_RETRY: "3"
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
