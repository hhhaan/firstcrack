name: Deploy Edge Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
  workflow_dispatch:
    inputs:
      function:
        description: 'Specific function to deploy (empty = deploy all changed)'
        required: false

concurrency:
  group: deploy-functions-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # pin: supabase/setup-cli@v1.7.1
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520
        with:
          version: 2.24.3

      - name: Resolve changed functions
        id: changed
        env:
          FUNCTION_INPUT: ${{ inputs.function }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          PROJECT_REF="vjdgdolfxvnxushxrmff"

          if [ -n "$FUNCTION_INPUT" ]; then
            echo "Deploying manually specified function: $FUNCTION_INPUT"
            echo "functions=[\"$FUNCTION_INPUT\"]" >> "$GITHUB_OUTPUT"
            echo "project_ref=$PROJECT_REF" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Detect changed function directories vs main (PR/local) or full push range on main
          CHANGED=$(git diff --name-only origin/main...HEAD -- supabase/functions/ || true)
          if [ -z "$CHANGED" ]; then
            # On main push: diff entire push (all commits), not only HEAD~1
            if [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
              CHANGED=$(git diff --name-only "${BEFORE_SHA}...HEAD" -- supabase/functions/ || true)
            else
              CHANGED=$(git diff --name-only HEAD~1 -- supabase/functions/ || true)
            fi
          fi

          if [ -z "$CHANGED" ]; then
            echo "No function changes detected"
            echo "functions=[]" >> "$GITHUB_OUTPUT"
            echo "project_ref=$PROJECT_REF" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Extract unique function directory names (excluding _shared)
          DIRS=$(echo "$CHANGED" | grep -oP '(?<=supabase/functions/)[^/]+' | grep -v '^_shared$' | sort -u)

          if [ -z "$DIRS" ]; then
            echo "Only _shared changes — deploying all functions"
            ALL=$(find supabase/functions -mindepth 1 -maxdepth 1 -type d ! -name '_shared' -exec basename {} \; | sort)
            DIRS="$ALL"
          fi

          FUNCTIONS=$(echo "$DIRS" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "Deploying functions: $FUNCTIONS"
          echo "functions=$FUNCTIONS" >> "$GITHUB_OUTPUT"
          echo "project_ref=$PROJECT_REF" >> "$GITHUB_OUTPUT"

      # EFs auto-deploy on main push but migrations deploy is manual — an EF
      # referencing new schema can go live before the schema exists. Warn loudly.
      - name: Warn if this push also touches migrations
        if: github.event_name == 'push' && steps.changed.outputs.functions != '[]'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          SLACK_WEBHOOK: ${{ secrets.VITE_SLACK_WEBHOOK_URL }}
        run: |
          if [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            MIG=$(git diff --name-only "${BEFORE_SHA}...HEAD" -- supabase/migrations/ || true)
          else
            MIG=$(git diff --name-only HEAD~1 -- supabase/migrations/ || true)
          fi
          if [ -n "$MIG" ]; then
            echo "::warning::This push also changes supabase/migrations/** — migrations deploy is MANUAL (Actions → Deploy migrations). Apply them before relying on the deployed functions."
            if [ -n "$SLACK_WEBHOOK" ]; then
              curl -s -X POST -H 'Content-type: application/json' "$SLACK_WEBHOOK" \
                --data "{\"text\":\":warning: *EF 자동배포에 마이그레이션 동반 변경* — 마이그레이션은 수동 배포 필요 (Actions → Deploy migrations) | <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>\"}"
            fi
          fi

      - name: Validate Supabase access token
        if: steps.changed.outputs.functions != '[]'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN secret is not set. Add it in repo Settings → Secrets → Actions."
            exit 1
          fi

      - name: Deploy functions
        if: steps.changed.outputs.functions != '[]'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          FUNCTIONS_JSON: ${{ steps.changed.outputs.functions }}
          PROJECT_REF: ${{ steps.changed.outputs.project_ref }}
        run: |
          echo "$FUNCTIONS_JSON" | jq -r '.[]' | while read fn; do
            echo "▶ Deploying $fn..."
            supabase functions deploy "$fn" \
              --project-ref "$PROJECT_REF" \
              --use-api \
              || { echo "::error::Deploy failed for $fn"; exit 1; }
          done
          echo "✅ All functions deployed"

      - name: Notify failure
        if: failure()
        env:
          SLACK_WEBHOOK: ${{ secrets.VITE_SLACK_WEBHOOK_URL }}
        run: |
          if [ -n "$SLACK_WEBHOOK" ]; then
            curl -s -X POST -H 'Content-type: application/json' "$SLACK_WEBHOOK" \
              --data "{\"text\":\":x: *Edge Function deploy FAILED* — <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>\"}"
          fi
