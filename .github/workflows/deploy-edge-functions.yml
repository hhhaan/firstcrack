name: Deploy Edge Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
  workflow_dispatch:
    inputs:
      function:
        description: 'Specific function to deploy (empty on manual dispatch = deploy all functions)'
        required: false

concurrency:
  group: deploy-functions-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # pin: supabase/setup-cli@v1.7.1
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359
        with:
          version: 2.24.3

      - name: Resolve changed functions
        id: changed
        env:
          FUNCTION_INPUT: ${{ inputs.function }}
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: node scripts/resolve-edge-functions.mjs

      # EFs auto-deploy on main push but migrations deploy is manual — an EF
      # referencing new schema can go live before the schema exists. Warn loudly.
      - name: Warn if this push also touches migrations
        if: github.event_name == 'push' && steps.changed.outputs.functions != '[]'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          SLACK_WEBHOOK: ${{ secrets.VITE_SLACK_WEBHOOK_URL }}
        run: |
          if [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            MIG=$(git diff --name-only "${BEFORE_SHA}...HEAD" -- supabase/migrations/ || true)
          else
            MIG=$(git diff --name-only HEAD~1 -- supabase/migrations/ || true)
          fi
          if [ -n "$MIG" ]; then
            echo "::warning::This push also changes supabase/migrations/** — migrations deploy is MANUAL (Actions → Deploy migrations). Apply them before relying on the deployed functions."
            if [ -n "$SLACK_WEBHOOK" ]; then
              curl -s -X POST -H 'Content-type: application/json' "$SLACK_WEBHOOK" \
                --data "{\"text\":\":warning: *EF 자동배포에 마이그레이션 동반 변경* — 마이그레이션은 수동 배포 필요 (Actions → Deploy migrations) | <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>\"}"
            fi
          fi

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        if: steps.changed.outputs.functions != '[]'
        with:
          deno-version: v2.x

      - name: deno check
        if: steps.changed.outputs.functions != '[]'
        working-directory: supabase/functions
        run: deno check --node-modules-dir=none ./*/index.ts

      # These are SAME-JOB gates: a separate successful/failed workflow cannot
      # order this deployment. No billing function deploys before every gate passes.
      - uses: actions/setup-node@v6
        if: steps.changed.outputs.functions != '[]'
        with:
          node-version: '24'

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.changed.outputs.functions != '[]'
        with:
          version: 11.3.0
          run_install: false
      - name: Billing unit tests and deployment gate regressions
        if: steps.changed.outputs.functions != '[]'
        run: node --test supabase/functions/_shared/polar.test.ts supabase/functions/_shared/polar-notifications.test.ts scripts/resolve-edge-functions.test.mjs scripts/check-polar-migration-ready.test.mjs

      - name: Install isolated PostgreSQL test dependency
        if: steps.changed.outputs.functions != '[]'
        run: |
          mkdir -p "$RUNNER_TEMP/polar-billing-tests"
          printf '{"private":true}\n' > "$RUNNER_TEMP/polar-billing-tests/package.json"
          pnpm --dir "$RUNNER_TEMP/polar-billing-tests" add --ignore-scripts --save-exact @electric-sql/pglite@0.3.14 typescript@5.9.3

      - name: Billing public schema type regression
        if: steps.changed.outputs.functions != '[]'
        run: node "$RUNNER_TEMP/polar-billing-tests/node_modules/typescript/bin/tsc" --noEmit --strict --skipLibCheck --target ES2020 --module ESNext --moduleResolution bundler supabase/tests/polar-database-types.ts

      - name: Billing PostgreSQL transaction tests
        if: steps.changed.outputs.functions != '[]'
        env:
          POLAR_PGLITE_MODULE: ${{ runner.temp }}/polar-billing-tests/node_modules/@electric-sql/pglite/dist/index.js
        run: node supabase/tests/polar-cutover.test.ts

      - name: Require billing migration and anonymous RPC denial before deployment
        if: contains(fromJSON(steps.changed.outputs.functions), 'polar-webhook') || contains(fromJSON(steps.changed.outputs.functions), 'create-polar-checkout')
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: node scripts/check-polar-migration-ready.mjs

      - name: Validate Supabase access token
        if: steps.changed.outputs.functions != '[]'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN secret is not set. Add it in repo Settings → Secrets → Actions."
            exit 1
          fi

      - name: Deploy functions
        if: steps.changed.outputs.functions != '[]'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          FUNCTIONS_JSON: ${{ steps.changed.outputs.functions }}
          PROJECT_REF: ${{ steps.changed.outputs.project_ref }}
          # `supabase functions deploy`는 이 셸 env를 런타임에 전달하지 않는다 — Edge Function이
          # Deno.env.get('SENTRY_RELEASE')를 읽게 하려면 이 값을 Supabase 프로젝트 시크릿으로도
          # 등록해야 한다 (`supabase secrets set SENTRY_RELEASE=first-crack@<sha>`, 수동 또는 별도
          # 문서화된 절차). 여기서는 배포 커맨드 자체의 컨텍스트로 export만 해둔다.
          SENTRY_RELEASE: first-crack@${{ github.sha }}
        run: |
          echo "$FUNCTIONS_JSON" | jq -r '.[]' | while read -r fn; do
            echo "▶ Deploying $fn..."
            supabase functions deploy "$fn" \
              --project-ref "$PROJECT_REF" \
              --use-api \
              || { echo "::error::Deploy failed for $fn"; exit 1; }
          done
          echo "✅ All functions deployed"

      # A function that fails to load (e.g. CJS named import) deploys fine and only dies
      # on first call with 503 BOOT_ERROR — deno check cannot see it. Call each one.
      # Anon bearer gets past the gateway so the function itself boots; any app-level
      # 4xx is a pass; transport errors, 5xx, and BOOT_ERROR fail.
      # firstcrack-mcp and firstcrack-oauth stay disabled until Edge flags are set.
      # Their own 503 disabled body is a successful boot. Any other 503 still fails.
      - name: Probe deployed functions
        if: steps.changed.outputs.functions != '[]'
        env:
          FUNCTIONS_JSON: ${{ steps.changed.outputs.functions }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          sleep 5 # settle so we probe the new version, not the previous deploy
          fail=0
          for fn in $(echo "$FUNCTIONS_JSON" | jq -r '.[]'); do
            : > body.txt
            if ! code=$(curl -sS --connect-timeout 10 --max-time 30 -o body.txt -w '%{http_code}' -X POST "${SUPABASE_URL}/functions/v1/${fn}" \
              -H "Authorization: Bearer ${ANON_KEY}" -H "apikey: ${ANON_KEY}" \
              -H "Content-Type: application/json" --data '{}'); then
              echo "::error::${fn}: request failed (HTTP ${code})"
              fail=1
              continue
            fi
            if [[ "$fn" == firstcrack-mcp || "$fn" == firstcrack-oauth ]] \
              && [[ "$code" == "503" ]] \
              && ! grep -q BOOT_ERROR body.txt \
              && grep -q -E 'Firstcrack connection is not enabled|temporarily_unavailable' body.txt; then
              echo "  OK: ${fn} disabled (HTTP ${code})"
              continue
            fi
            if [[ ! "$code" =~ ^[234][0-9]{2}$ ]] || grep -q BOOT_ERROR body.txt; then
              echo "::error::${fn}: HTTP ${code} — $(head -c 300 body.txt)"
              fail=1
            else
              echo "  OK: ${fn} (HTTP ${code})"
            fi
          done
          [ "$fail" -eq 0 ] || exit 1

      - name: Notify failure
        if: failure()
        env:
          SLACK_WEBHOOK: ${{ secrets.VITE_SLACK_WEBHOOK_URL }}
        run: |
          if [ -n "$SLACK_WEBHOOK" ]; then
            curl -s -X POST -H 'Content-type: application/json' "$SLACK_WEBHOOK" \
              --data "{\"text\":\":x: *Edge Function deploy FAILED* — <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>\"}"
          fi
