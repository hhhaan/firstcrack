name: CI

# 문서/에이전트 설정만 바뀌면 CI 스킵.
# apps/docs/** .md는 빌드 영향 → **.md 말고 루트 *.md만.
# .gitignore ≠ CI 필터: 이미 추적 중인 docs/plans 등은 ignore여도 push되면 트리거됨.
on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'plans/**'
      - '.agents/**'
      - '.claude/**'
      - '.grok/**'
      - '.cursor/**'
      - '.vscode/**'
      - '.codex/**'
      - '.opencode/**'
      - '.superpowers/**'
      - 'repomix-output.xml'
      - 'code_review.txt'
      - 'code_review.*'
      - 'code-review.*'
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'plans/**'
      - '.agents/**'
      - '.claude/**'
      - '.grok/**'
      - '.cursor/**'
      - '.vscode/**'
      - '.codex/**'
      - '.opencode/**'
      - '.superpowers/**'
      - 'repomix-output.xml'
      - 'code_review.txt'
      - 'code_review.*'
      - 'code-review.*'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Type check
        run: pnpm typecheck

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Biome check
        run: pnpm check

      - name: i18n key sync
        run: pnpm check:i18n

      - name: Roaster registry py↔ts sync
        run: pnpm check:registry

  eslint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: ESLint (react-refresh)
        run: pnpm lint

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Vitest
        run: pnpm test

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Secretlint
        run: pnpm scan:secrets

  # 모바일 cfg 게이트 회귀 방지 — 데스크톱 전용 코드(사이드카/업데이터)가
  # 게이트 없이 추가되면 여기서 잡힌다. 빌드/서명 없이 컴파일만 확인.
  ios-check:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Add iOS target
        run: rustup target add aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Cargo check (iOS)
        run: cargo check --target aarch64-apple-ios
        working-directory: src-tauri

  sidecar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: src-tauri/sidecar/requirements-dev.txt

      - name: Install sidecar test dependencies
        run: pip install -r src-tauri/sidecar/requirements-dev.txt

      - name: Run sidecar tests
        run: python -m pytest tests/ -q --tb=short
        working-directory: src-tauri/sidecar
