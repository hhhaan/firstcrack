name: CI

# 문서/에이전트 설정만 바뀌면 워크플로 전체 스킵.
# apps/docs/** .md는 빌드 영향 → **.md 말고 루트 *.md만.
# .gitignore ≠ CI 필터: 이미 추적 중인 docs/plans 등은 ignore여도 push되면 트리거됨.
# main push는 품질 job을 전부 돈다. private repo는 branch protection이 없고
# `pnpm release`가 main SHA의 check-run으로 릴리스를 연다.
# PR만 clippy / sidecar / edge-check를 변경 경로로 좁힌다 (scripts/ci-changed-areas.mjs).
# diff를 확신할 수 없거나 changes 잡이 실패하면 그 세 잡은 그대로 돈다.
# main에서는 changes가 스킵된다. 스킵은 success가 아니라서 세 잡이 돈다.
on:
  pull_request:
    branches: [main]
    paths-ignore: &skip-docs
      - '*.md'
      - 'docs/**'
      - 'plans/**'
      - '.agents/**'
      - '.claude/**'
      - '.grok/**'
      - '.cursor/**'
      - '.vscode/**'
      - '.codex/**'
      - '.opencode/**'
      - '.superpowers/**'
      - 'code_review.txt'
      - 'code_review.*'
      - 'code-review.*'
  push:
    branches: [main]
    paths-ignore: *skip-docs

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Cheap SHA diff so macos ios-check is not queued on frontend-only PRs.
  # ponytail: iPad 미지원 동안 꺼둠 — paths가 skip되면 ios-check도 skip(needs), ci-gate·release.mjs는 skipped=pass.
  # 지원 재개 시 repo variable IOS_CHECK=true 로 켜거나 아래 if 한 줄 삭제.
  paths:
    if: vars.IOS_CHECK == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tauri: ${{ steps.detect.outputs.tauri }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: detect
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${BASE:-}" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "tauri=true" >> "$GITHUB_OUTPUT"
            echo "No base SHA — run ios-check"
            exit 0
          fi
          if git diff --name-only "$BASE" "$HEAD" | grep -q '^src-tauri/'; then
            echo "tauri=true" >> "$GITHUB_OUTPUT"
            echo "src-tauri changed — run ios-check"
          else
            echo "tauri=false" >> "$GITHUB_OUTPUT"
            echo "src-tauri unchanged — skip ios-check"
          fi

  # PR-only filter. Skipped (main) or failed → clippy/sidecar/edge-check run. Success with output false → skip.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      clippy: ${{ steps.detect.outputs.clippy }}
      sidecar: ${{ steps.detect.outputs.sidecar }}
      edge: ${{ steps.detect.outputs.edge }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: detect
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.sha }}
        run: node scripts/ci-changed-areas.mjs

  # Same order as verify:core, then lint + secretlint (those two stay out of the test process).
  # dependency-cruiser and the bundle regression share this install.
  # Job id is the check-run name — keep in sync with scripts/check-release-ci.mjs.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Biome
        run: pnpm check

      - name: i18n
        run: pnpm check:i18n

      - name: Roaster registry
        run: pnpm check:registry

      - name: Tauri package versions
        run: pnpm check:tauri-versions

      - name: Plan caps
        run: pnpm check:plan-caps

      - name: Harness regression checks
        run: pnpm check:harness

      - name: Knip
        run: pnpm knip --reporter github-actions --reporter symbols
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-anon-key-not-a-secret

      - name: Type check
        run: pnpm typecheck

      - name: ESLint
        run: pnpm lint

      - name: Secretlint
        run: pnpm scan:secrets

      - name: dependency-cruiser
        run: pnpm check:architecture

      - name: Bundle regression
        run: pnpm check:bundle

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Vitest
        run: pnpm test

  # 모바일 cfg 게이트 회귀 방지 — 데스크톱 전용 코드(사이드카/업데이터)가
  # 게이트 없이 추가되면 여기서 잡힌다. 빌드/서명 없이 컴파일만 확인.
  ios-check:
    needs: paths
    if: needs.paths.outputs.tauri == 'true'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Add iOS target
        run: rustup target add aarch64-apple-ios

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Cargo check (iOS)
        run: cargo check --target aarch64-apple-ios
        working-directory: src-tauri

  # Host lint. macOS-only cfg (app_nap imp) is not compiled on ubuntu.
  clippy:
    needs: changes
    if: "${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.clippy == 'true') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
          components: clippy

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: src-tauri
      - name: Native unit tests
        run: cargo test --locked --lib
        working-directory: src-tauri

  native-tests:
    needs: changes
    if: "${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.clippy == 'true') }}"
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      TAURI_CONFIG: '{"bundle":{"externalBin":[]}}'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      - name: Native unit tests
        run: cargo test --locked --lib
        working-directory: src-tauri

  sidecar:
    needs: changes
    if: "${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.sidecar == 'true') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: src-tauri/sidecar/requirements-dev.txt

      - name: Install sidecar test dependencies
        run: pip install -r src-tauri/sidecar/requirements-dev.txt

      - name: Run sidecar tests
        run: python -m pytest tests/ -q --tb=short
        working-directory: src-tauri/sidecar

  # Edge Function type check. _shared/*.test.ts already run under vitest (test job).
  # Job id is the check-run name — keep in sync with scripts/check-release-ci.mjs.
  # --node-modules-dir=none: root package.json would otherwise make deno resolve npm: specifiers
  # from node_modules (byonm), which is not how the edge runtime resolves them.
  edge-check:
    needs: changes
    if: "${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.edge == 'true') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - name: deno check
        working-directory: supabase/functions
        run: deno check --node-modules-dir=none ./*/index.ts

  # SAST — official semgrep image, no pnpm install. Gate on ERROR only (WARNING = mutable action tags etc.).
  # ws:// rule excluded: roasters are LAN devices without TLS. secrets-inherit: reusable workflows by design.
  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      # digest of semgrep/semgrep:latest on 2026-09-25. p/* rules still load at runtime.
      image: semgrep/semgrep@sha256:acaac22ffc7b7cc5926de0751b223bce0b2491c33d18422fa72f632c78d81198
    steps:
      - uses: actions/checkout@v7

      - name: Semgrep
        run: >-
          semgrep scan --error --severity ERROR
          --config p/default --config p/typescript --config p/react --config p/python --config p/rust --config p/github-actions --config p/secrets
          --exclude-rule javascript.lang.security.detect-insecure-websocket.detect-insecure-websocket
          --exclude-rule yaml.github-actions.security.secrets-inherit.secrets-inherit

  # History-range only. Full git history still has a June 2026 sentry-org-token
  # in now-ignored .codex/.mcp.json/repomix dumps — that is the Monday job's catch-up window, not this gate.
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/gitleaks

      - name: Scan this change
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${BASE:-}" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            gitleaks git . --log-opts='-1' --verbose --redact --no-banner
            exit 0
          fi
          gitleaks git . --log-opts="${BASE}..${HEAD}" --verbose --redact --no-banner

  # Workflow syntax. Fast, no pnpm install.
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: actionlint
        run: node scripts/check-actions.mjs

  # Workflow security. Policy: .github/zizmor.yml. Always on — the scan is seconds.
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: zizmor
        run: node scripts/check-zizmor.mjs
