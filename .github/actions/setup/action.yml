name: Setup pnpm + Node
description: pnpm, Node 22 (pnpm cache), install dependencies

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm

    - name: Install dependencies
      run: pnpm install
      shell: bash
