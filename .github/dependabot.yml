# Dependabot — weekly, one version-update PR per ecosystem
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates
#
# Mon 09:00 KST. open-pull-requests-limit: 1 so an unmerged PR blocks
# the next week's run (no stacking). One catch-all group per ecosystem
# so prod/dev/plugins don't split into extra PRs.
# Security updates ignore this limit.
#
# Keep cooldown ≥ pnpm minimumReleaseAge (default 1440m / 1d in pnpm 11).
# Otherwise Dependabot commits a lockfile CI cannot install
# (ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION).

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 1
    cooldown:
      default-days: 3
      semver-major-days: 14
      semver-minor-days: 3
      semver-patch-days: 2
    groups:
      frontend:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 1
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /src-tauri/sidecar
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 1
    cooldown:
      default-days: 3
      semver-major-days: 14
    groups:
      sidecar-python:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 1
    cooldown:
      default-days: 3
      semver-major-days: 14
    groups:
      rust:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
