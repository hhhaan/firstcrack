# Dependabot — weekly dependency update PRs
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates
#
# Keep cooldown ≥ pnpm minimumReleaseAge (default 1440m / 1d in pnpm 11).
# Otherwise Dependabot commits a lockfile CI cannot install
# (ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION).

version: 2
updates:
  # Frontend (pnpm via packageManager + pnpm-lock.yaml)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    # Wait until packages are old enough for pnpm install + fewer bad publishes
    cooldown:
      default-days: 3
      semver-major-days: 14
      semver-minor-days: 3
      semver-patch-days: 2
    labels:
      - dependencies
      - npm
    groups:
      frontend-prod:
        dependency-type: production
        update-types:
          - minor
          - patch
      frontend-dev:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      # Majors need a deliberate upgrade (TS 7, zod 4, plugin-react 6, …)
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 3
    cooldown:
      default-days: 3
    labels:
      - dependencies
      - github-actions
    groups:
      actions:
        patterns:
          - "*"

  # Sidecar Python
  - package-ecosystem: pip
    directory: /src-tauri/sidecar
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 3
    cooldown:
      default-days: 3
      semver-major-days: 14
    labels:
      - dependencies
      - python
    groups:
      sidecar-python:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Tauri / Rust
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 3
    cooldown:
      default-days: 3
      semver-major-days: 14
    labels:
      - dependencies
      - rust
    groups:
      tauri-plugins:
        patterns:
          - "tauri*"
        update-types:
          - minor
          - patch
      rust-misc:
        patterns:
          - "*"
        exclude-patterns:
          - "tauri*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
