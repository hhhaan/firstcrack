# Automatic Analysis — https://docs.sonarsource.com/sonarqube-cloud/analyzing-source-code/automatic-analysis/
sonar.python.version=3.13

# Applied SQL migrations are append-only. Generated DB types and the dual-SSoT
# roaster registry duplicate by design — they must not fail the duplication gate.
sonar.cpd.exclusions=supabase/migrations/**,src/shared/types/database.types.ts,src-tauri/sidecar/roaster_registry.py

# Cache-warm job: SHA-pin / --ignore-scripts / --only-binary findings fight
# Dependabot and native sidecar wheels. Release/CI workflows stay in scope.
sonar.exclusions=.github/workflows/warm-release-cache.yml
