[package]
name = "roastery-agent"
version = "1.2.15"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "roastery_agent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-os = "2.3.2"
tauri-plugin-store = "2.4.3"
tauri-plugin-deep-link = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
sentry = "0.42"
tauri-plugin-sentry = "0.5.0"

# 데스크톱 전용 — 모바일은 스토어 배포(업데이터 불가)·단일 인스턴스 개념 없음, 사이드카 스폰 불가
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tokio = { version = "1", features = ["time"] }

# App Nap 억제 (#308). beginActivity 토큰을 프로세스 수명 동안 보유.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSProcessInfo",
    "NSString",
] }

[profile.release]
lto = true
codegen-units = 1
# debug=1(line tables) + split-debuginfo="packed"로 심볼을 바이너리 밖(macOS .dSYM / Windows .pdb)으로
# 뽑아낸 뒤 strip=true로 배포 바이너리에서 제거한다 — Sentry 업로드용 심볼은 별도 파일로 남는다.
debug = 1
split-debuginfo = "packed"
strip = true
