[[permission]]
identifier = "desktop-commands"
description = "Allow native desktop commands from the main application window."
commands.allow = [
    "relaunch_for_update",
    "macos_app_is_in_applications",
    "sidecar_token",
    "sync_roast_monitor",
    "show_roast_main",
    "update_menu_bar_metrics",
    "read_firescope_settings",
    "read_artisan_settings",
    "read_cropster_settings",
]
